<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Audio transcription tools comparison</title>
  <desc id="desc">Illustrative comparison scores for transcription quality, meeting-note quality, agent programmability, cost flexibility, and private deployment.</desc>
  <rect width="1120" height="720" fill="#f7f5ef"/>
  <rect x="48" y="44" width="1024" height="632" rx="12" fill="#ffffff" stroke="#d8ddd1"/>
  <text x="80" y="92" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#15391d">语音转写工具能力对比（示意）</text>
  <text x="80" y="122" font-family="Arial, sans-serif" font-size="15" fill="#556055">分数为项目宣传示意，不代表官方或严谨 benchmark；真实发布建议替换为自测数据。</text>
